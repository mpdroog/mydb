# mydb config. Copy to config.toml and chmod 0600 it, the MySQL and SSH
# passwords are stored in cleartext.
#
#   cp config.example.toml config.toml && chmod 0600 config.toml
#
# devnote: the GUI rewrites this file when you add/edit/remove a server,
# which drops these comments. The previous version is kept as config.toml.bak.

listen = "localhost:9999"

# Every network operation draws its deadline from here. Nothing in mydb is
# allowed to hang, so raise these rather than removing them.
[timeout]
ssh_dial      = "5s"    # TCP + SSH handshake to the bastion
mysql_connect = "5s"    # MySQL handshake once the tunnel is up
meta_query    = "5s"    # database/table/structure lookups
data_query    = "30s"   # grid loads and console queries
# ALTER TABLE has NO deadline by default, and that is deliberate. A deadline
# bounds work that might never finish; an ALTER will finish, and killing it
# half-way through a table rebuild throws away the work done so far and then
# makes you wait for the rollback. A long ALTER is slow, not hung: mydb shows
# it live (stage, percentage, elapsed) with a Cancel button, and it keeps
# running if you close the tab. Set a duration here if you want one anyway.
ddl_query     = "0s"    # 0 = no deadline
ssh_keepalive  = "15s"  # how fast a dead tunnel is noticed
conn_lifetime  = "5m"   # recycle pooled MySQL connections
idle_reap      = "10m"  # close tunnel + pool after this much idle time
http_read_hdr  = "5s"
http_idle      = "60s"
dashboard_poll = "3s"   # how often an open dashboard asks what the server is doing

# Every statement mydb runs is appended here, one JSON object per line, so
# "what did I run against prod last week" has an answer. The GUI searches it
# (the Log button, or Ctrl/Cmd+Shift+L) and so does grep and jq. It holds the
# literal values of your statements, so it is written 0600 like this file.
[log]
# Relative names are resolved next to this config-file. Set to "" to switch
# the log off entirely.
queries     = "mydb-queries.jsonl"
max_size_mb = 32        # rotate once the file grows past this
keep        = 1         # how many rotated generations to keep

# A plain local server.
[[server]]
name = "local"
host = "127.0.0.1"
port = 3306
user = "root"
pass = ""
# Mark the servers where a mistake is expensive. It changes nothing about how
# mydb connects: it draws the server red everywhere it appears, and makes a
# statement that changes data without a WHERE ask you to type the server's
# name rather than click a button.
#production = true

# A server behind a bastion. host/port are resolved on the SSH host, so
# 127.0.0.1 here means "localhost as the bastion sees it".
#
# The bastion's host key must already be in ~/.ssh/known_hosts: mydb will
# not trust an unknown key. Run `ssh mp@bastion.example.com` once first.
#[[server]]
#name = "prod-eu"
#host = "127.0.0.1"
#port = 3306
#user = "readonly"
#pass = "hunter2"
#production = true
#
#  [server.ssh]
#  host  = "bastion.example.com:22"
#  user  = "mp"
#  agent = true                      # use SSH_AUTH_SOCK (preferred)
#  #key        = "~/.ssh/id_ed25519" # or a key file
#  #passphrase = ""                  # if the key is encrypted
#  #pass       = ""                  # last resort: password auth

# Session settings applied to every MySQL connection.
[mysql]
# Without STRICT_ALL_TABLES a server silently truncates on write: editing a
# cell to a value too long for its column stores a cut-down version, still
# reports one row affected, and the grid would show a value the database
# does not hold. Set to "" to inherit the server's own global sql_mode.
sql_mode = "STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION"

# This is the deadline that actually matters for DDL. MySQL ships with
# lock_wait_timeout at a year and MariaDB at a day, so an ALTER that cannot get
# its metadata lock queues behind whatever holds it -- and then every read and
# write of that table queues behind the ALTER. Failing in half a minute is much
# kinder than taking the table down. Set "0s" to leave the server's own value.
lock_wait_timeout = "30s"
